
<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Day 08 - Shared State</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <h2>Welcome, {{ user$ | async }}!</h2>

  <ion-item>
    <ion-input
      label="Update your name"
      labelPlacement="stacked"
      placeholder="Enter your name"
      [(ngModel)]="userName">
    </ion-input>
  </ion-item>

  <ion-button expand="block" (click)="updateUser()">
    Update User
  </ion-button>

  <h2>My Task List</h2>

  <ion-item>
    <ion-input
      label="New Task"
      labelPlacement="stacked"
      placeholder="Enter task name"
      [(ngModel)]="newTask">
    </ion-input>
  </ion-item>

  <ion-button expand="block" (click)="addTask()">
    Add Task
  </ion-button>

  <ion-list>
    <ion-item *ngFor="let task of tasks$ | async">
      <ion-checkbox
        slot="start"
        [checked]="task.completed"
        (ionChange)="toggleTask(task.id)">
      </ion-checkbox>

      <ion-label>
        {{ task.title }}
        <p>{{ task.completed ? 'Completed' : 'Pending' }}</p>
      </ion-label>
    </ion-item>
  </ion-list>

</ion-content>
